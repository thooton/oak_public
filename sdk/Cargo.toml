[package]
name = "oak-sdk"
version = "0.3.0"
edition = "2024"
description = "Oak's plugin interface (a C ABI: include/oak_plugin.h) and a Rust wrapper over it."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ecolor = "0.37"
emath = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
