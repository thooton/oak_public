[package]
name = "oak"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["sdk", "plugins/hello", "plugins/aws-quick-signup"]

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
eframe = "0.37"
libloading = "0.8"
oak-sdk = { path = "sdk" }
iana-time-zone = "0.1"
memchr = "2.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open = "5.4.5"
pulldown-cmark = { version = "0.13.5", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls", "gzip", "brotli", "deflate", "zstd"] }
rfd = "0.17"
# Quick's chat is a WebSocket of its own (src/quick.rs): its TLS is rustls, as reqwest's is.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"

# build.rs: unpacking and checking the ripgrep it bundles (both are in the
# tree already).
[build-dependencies]
flate2 = "1.1"
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The monitors, to put the window back where it was (`src/geometry.rs`);
# winit's own, so nothing new is built.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["allow-unsafe-code", "dl-libxcb", "randr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Image decoding and scaling are very slow unoptimized; this keeps debug
# builds and tests quick without slowing down compiling OAK itself.
[profile.dev.package.image]
opt-level = 3
