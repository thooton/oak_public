# The example plugin: the smallest crate Oak loads. Copy it to start one.
[package]
name = "oak-hello"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin is a dynamic library (liboak_hello.so, oak_hello.dll).
[lib]
crate-type = ["cdylib"]

[dependencies]
# What a plugin is written against.
oak-sdk = { path = "../../sdk" }
# Oak itself, for the dependency graph only: cargo then builds this crate's
# copies of egui and the rest exactly as it builds Oak's (docs/PLUGINS.md).
oak = { path = "../.." }
