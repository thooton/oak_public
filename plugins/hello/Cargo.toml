# The example plugin: the smallest crate Oak loads. Copy it to start one
# (plugins/hello-c is the same in C).
[package]
name = "oak-hello"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin is a dynamic library (liboak_hello.so, oak_hello.dll).
[lib]
crate-type = ["cdylib"]

[dependencies]
# All a plugin is written against: Oak's interface (a C header underneath),
# made comfortable in Rust.
oak-sdk = { path = "../../sdk" }
