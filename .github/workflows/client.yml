# The Oak app: build on every push and pull request, on Windows and Linux.
# A push to the default branch (master) that builds is also
# published as a release, v<version>, marked latest, which every Oak offers as
# an update on its Home page (src/update.rs).
#
# The version is MAJOR.MINOR from Cargo.toml and the number of commits up to
# the one built (build.rs), so each commit on master has its own and they only
# go up. Bump MAJOR or MINOR in Cargo.toml for a bigger step.
#
# Release assets (src/update.rs looks for these names):
#   oak-windows-x86_64.exe          the Windows app
#   oak_aws_quick_signup.dll        the optional Home plugin on Windows
#   oak-linux-x86_64                the Linux binary, what the updater installs
#   oak-linux-x86_64.tar.gz         the Linux bundle (linux/package.sh)
# each with a .sha256 beside it.
name: Oak app

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "sdk/**"
      - "plugins/**"
      - "assets/**"
      - "prompts/**"
      - "linux/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "src/**"
      - "sdk/**"
      - "plugins/**"
      - "assets/**"
      - "prompts/**"
      - "linux/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/client.yml"
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release from this run (default branch only)
        type: boolean
        default: true

permissions:
  contents: read

# On the default branch (master), runs go one after another so releases come
# out in order; elsewhere a newer push cancels the run of the older one.
concurrency:
  group: oak-app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  CARGO_TERM_COLOR: always
  # Release builds are marked as such (no "-dev" in their version).
  OAK_RELEASE: "1"
  # Tests never look for updates.
  OAK_NO_UPDATE: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # 22.04 so the binary needs no newer glibc than 2.35.
          - name: Linux
            os: ubuntu-22.04
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the version counts the commits.
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          major_minor=$(sed -n 's/^version = "\([0-9]*\)\.\([0-9]*\)\..*"/\1.\2/p' Cargo.toml | head -1)
          version="$major_minor.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Oak $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-release
          # Keep the compiled dependencies even when a test fails, so the
          # next run doesn't start from nothing.
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

      # Keep a runnable binary for startup diagnostics.
      - name: Build (release)
        id: build
        run: cargo build --release --locked -p oak -p oak-aws-quick-signup

      - name: Check the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          exe=target/release/oak
          [ "$RUNNER_OS" = Windows ] && exe=target/release/oak.exe
          got=$("$exe" --version | cut -d' ' -f2)
          echo "built: $got, expected: $VERSION"
          test "$got" = "$VERSION"

      # How long startup takes (src/startup.rs): the release build started
      # until its first frame is on screen, under a fresh profile and under
      # one with 300 conversations (~200 MB, .github/startup_profile.py),
      # first just written and then again unchanged; on Windows with
      # Defender's real-time scanning on and off. Each run's startup.log
      # goes to the run's summary. Informational: it never fails the build.
      - name: Time startup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          exe=target/release/oak
          [ "$RUNNER_OS" = Windows ] && exe=target/release/oak.exe
          py=$(command -v python3 || command -v python)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y xvfb libgl1-mesa-dri > /dev/null
          fi
          defender() {
            [ "$RUNNER_OS" = Windows ] || return 0
            powershell -NoProfile -Command "Set-MpPreference -DisableRealtimeMonitoring \$$1" || true
            powershell -NoProfile -Command "(Get-MpComputerStatus).RealTimeProtectionEnabled" || true
          }
          timed() {
            rm -f "$1/startup.log"
            if [ "$RUNNER_OS" = Linux ]; then OAK_DIR="$1" xvfb-run -a "$exe" & else OAK_DIR="$1" "$exe" & fi
            for _ in $(seq 300); do [ -s "$1/startup.log" ] && break; sleep 0.2; done
            sleep 1
            if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM oak.exe > /dev/null 2>&1; else pkill -f "$exe"; fi
            wait
            {
              echo "### $RUNNER_OS: $2"
              echo '```'
              cat "$1/startup.log" 2>/dev/null || echo "(no startup.log: no first frame within a minute)"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          }
          for scan in false true; do
            [ "$RUNNER_OS" = Windows ] || [ $scan = false ] || break
            on=$(defender "$([ $scan = true ] && echo false || echo true)" | tail -1)
            label=""; [ "$RUNNER_OS" = Windows ] && label=", real-time scanning: ${on:-unknown}"
            fresh="$RUNNER_TEMP/startup-fresh-$scan"; big="$RUNNER_TEMP/startup-big-$scan"
            mkdir -p "$fresh"
            timed "$fresh" "a fresh profile$label"
            "$py" .github/startup_profile.py "$big" 300 100
            timed "$big" "300 conversations just written$label"
            timed "$big" "300 conversations, started again$label"
          done
          defender false > /dev/null

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          bash linux/package.sh
          mkdir -p dist
          cp target/dist/oak-linux-x86_64.tar.gz dist/
          cp target/dist/oak-linux-x86_64/oak dist/oak-linux-x86_64

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/release/oak.exe dist/oak-windows-x86_64.exe
          cp target/release/oak_aws_quick_signup.dll dist/

      - name: Checksums
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi | sed 's/ \*/  /' > "$f.sha256"
          done
          cat *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: oak-${{ steps.version.outputs.version }}-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes
        run: |
          # The commits since the last release (their first lines, cut short).
          prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname --merged HEAD | head -1)
          {
            echo "Oak $VERSION, built from ${GITHUB_SHA:0:10}."
            echo
            if [ -n "$prev" ]; then
              echo "Since $prev:"
              range="$prev..HEAD"
            else
              range="HEAD~10..HEAD"
            fi
            git log --no-merges --format='%h %s' "$range" -- src sdk plugins vendor assets prompts linux build.rs Cargo.toml Cargo.lock \
              | head -40 | cut -c1-240 | sed 's/^/- /'
            echo
            echo "Oak installs this itself (Home, at the right end of its tabs' row). By hand: Windows, oak-windows-x86_64.exe in place of oak.exe; Linux, unpack oak-linux-x86_64.tar.gz and run ./oak (./install.sh adds it to the launcher)."
          } > notes.md
          cat notes.md

      - name: Publish v${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          ls -l dist
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag exists already: its assets are replaced."
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Oak $VERSION" --notes-file notes.md --latest
          fi

      - name: Keep the 20 newest releases
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
          while read -r tag; do
            echo "Removing $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
